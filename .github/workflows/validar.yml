name: Validar conexão com o Instagram
on:
  push:
    paths: ["validar.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 publicar.py --validar
      - run: |
          git config user.name "auto-brasil-bot"; git config user.email "bot@users.noreply.github.com"
          git add validacao.json; git commit -m "Resultado da validação" && git push
