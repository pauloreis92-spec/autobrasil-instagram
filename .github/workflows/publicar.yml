name: Publicar no Instagram
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Publicar agora o próximo item da fila (teste)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar o que chegou a hora
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 publicar.py ${{ inputs.teste && '--teste' || '' }}
      - name: Salvar status da fila
        run: |
          git config user.name "auto-brasil-bot"
          git config user.email "bot@users.noreply.github.com"
          git add fila
          git diff --cached --quiet || (git commit -m "Atualiza status da fila" && git pull --rebase && git push)
